
services:
  - type: web
    name: yonko-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yonko-db
          property: connectionString
      - key: YONKO_SESSION_SECRET
        generateValue: true   # strong random secret, managed by Render
      - key: TRUST_PROXY
        value: "1"            # honour X-Forwarded-For behind Render's proxy
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: CORS_ALLOW_ORIGINS
        sync: false           # you'll be asked for this value: your Vercel URL(s), comma-separated
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: yonko-db
    plan: free
    databaseName: yonko
