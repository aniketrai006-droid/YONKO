# docker-compose.yml — YONKO development stack
#
# Services:
#   db   — PostgreSQL 16 on the internal backend_net network only.
#          NO published host port by design: the database is not reachable from
#          outside Docker, reducing the attack surface.
#   api  — FastAPI application, reachable at http://localhost:8000.
#
# Usage:
#   cp .env.example .env          # fill in real values
#   docker compose up --build -d  # start both services
#   docker compose exec api alembic upgrade head  # run migrations
#   docker compose down -v        # tear down (removes pgdata volume)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yonko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-yonko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    # Security: no ports: section — the DB is intentionally unreachable from the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yonko} -d ${POSTGRES_DB:-yonko}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the db service hostname inside Docker.
      # This takes precedence over any DATABASE_URL in .env.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-yonko}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-yonko}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - default   # also on the default bridge so the host can reach port 8000
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # Bind to loopback only so the S3 API and admin console are not reachable
      # from other hosts on the network. The api service reaches MinIO via the
      # backend_net hostname (minio:9000) without touching these host ports.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    networks:
      - backend_net
    profiles: [uploads]
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  backend_net:
    # internal: true means containers on this network cannot reach the internet
    # and the host cannot reach containers on this network directly.
    internal: true
